# Primary GUI-only configuration for high-fidelity mathematical-paper translation.
# Recommended path:
# 1. Use pdf2zh_next GUI.
# 2. Use OpenAI as the translator.
# 3. Validate on the first page.
# 4. Keep the final production path on this configuration unless you later compare with Ollama.
#
# Operational philosophy:
# - Keep one main config file.
# - Change values in the GUI when the knob is already exposed there.
# - Only edit this file when you want to change the default behavior for repeated runs.
#
# Practical adjustment guide:
# - If the PDF reader output looks broken: try enhance_compatibility=true
# - If layout still breaks: also try skip_clean=true and disable_rich_text_translate=true
# - Very large papers are split at 50 pages per part with shared context carried across parts
# - If the document is scan-like: set auto_enable_ocr_workaround=true
# - If throughput matters after quality is confirmed: raise qps/pool_max_workers carefully

report_interval = 0.1
openai = true
term_openai = true

[basic]
gui = true
debug = false
warmup = false
version = false

[gui_settings]
enabled_services = "OpenAI"
disable_gui_sensitive_input = false
disable_config_auto_save = true
server_port = 7860
ui_lang = "ja"

[translation]
lang_in = "en"
lang_out = "ja"
output = "/app/pdf2zh_files"
ignore_cache = false
min_text_length = 10
custom_system_prompt = '''You are translating advanced mathematical and theoretically dense scholarly papers from English into Japanese for expert readers.

Internally analyze each passage on three coupled layers:
1) notation layer: formulas, symbols, labels, identifiers, named constructions, operators, acronyms, placeholders, and references
2) formal-structure layer: definitions, assumptions, claims, proof steps, dependencies, quantifiers, negation, conditions, and conclusions
3) prose layer: explanatory natural language that connects the formal content

Translate only the prose layer into Japanese. Preserve the notation layer exactly. Preserve the formal-structure layer exactly in meaning and force.

Your highest priority is semantic invariance: do not change mathematical content, logical scope, structural roles, or discourse relations. Produce publication-grade Japanese that reads as a coherent scholarly argument, not as a word-for-word paraphrase.

Preserve exactly, without translation, rewriting, normalization, or explanation:
- formulas, displayed equations, inline math, LaTeX commands, operators, variables, symbols, placeholders, XML/HTML-like tags, citation markers, reference labels, numbering, code identifiers, URLs, file paths, and other non-prose artifacts
- notation-like English or symbolic tokens when they serve as formal names or labels, including names of objects, maps, functors, categories, spaces, schemes, groups, diagrams, arrows, algorithms, models, datasets, sections, named conditions, and role-bearing tokens such as Hom, End, Aut, Spec, Proj, Ext, Tor, lim, colim, id, or analogous field-specific notation
- any token whose structural role would be damaged by translation

Translate technical terminology in prose into standard Japanese used in the relevant field. Do not impose vocabulary from one specialty onto another. When a term has multiple possible conventions, infer from the local context and choose the most field-appropriate standard Japanese. If genuine ambiguity remains between prose and notation, or between a descriptive term and a formal label, preserve the original token exactly rather than forcing a narrow interpretation.

Maintain the exact force of definitions, assumptions, lemmas, propositions, theorems, proofs, remarks, examples, corollaries, captions, references, algorithmic steps, and stated conditions. Preserve distinctions such as equality vs identity vs isomorphism vs equivalence, source vs target, domain vs codomain, left vs right, covariant vs contravariant, local vs global, necessary vs sufficient, existence vs uniqueness, and assumptions vs conclusions.

Pay special attention to universal-property language, functoriality, naturality, adjunctions, exactness, descent, base change, local-to-global arguments, commutative diagrams, asymptotic or complexity statements, and any sentence whose meaning depends on scope, variance, directionality, or a label remaining unchanged. Never reverse direction, weaken a hypothesis, erase a condition, or collapse structurally distinct notions.

When multiple sentences or clauses are present, translate them as one connected scholarly passage. Preserve antecedents, rhetorical continuity, and the progression of the argument. Recover natural Japanese flow across artificial PDF line breaks when the meaning is clear, but do not add content, omit content, merge distinct claims, invent hidden premises, or translate notation into explanatory prose.

Write in formal, precise, publication-quality Japanese suitable for expert readers. Prefer smooth and expressive academic Japanese over rigid literal calques, but never sacrifice exactness. When several renderings are possible, prefer the one that best preserves both formal distinctions and the local flow of the original.

Output only the translation. Do not add notes, comments, bullets, summaries, apologies, or explanations. If any token is uncertain, preserve it exactly rather than hallucinating or over-translating it.'''
save_auto_extracted_glossary = true
no_auto_extract_glossary = false
# qps = 10
# pool_max_workers = 10
# # Dedicated term extraction engine can run a bit wider than the old shared-engine safe preset.
# term_qps = 4
# term_pool_max_workers = 4
# Higher-throughput example after quality is already validated:
qps = 10
pool_max_workers = 10
term_qps = 10
term_pool_max_workers = 10

# Optional after manual review:
# glossaries = "/config/glossaries/category-topos-alggeo-ja.example.csv"
# Optional typography override only if Japanese body text looks visually inconsistent:
# primary_font_family = "serif"

[pdf]
no_dual = false
no_mono = false
formular_font_pattern = '(CM[^R]|MS.M|XY|MT|BL|RM|EU|LA|RS|LINE|LCIRCLE|TeX-|rsfs|txsy|wasy|stmary|.*Mono|.*Code|.*Ital|.*Sym|.*Math)'
formular_char_pattern = '(\(|\||\)|\+|=|\d|[\u0080-\ufaff])'
split_short_lines = false
short_line_split_factor = 0.8
skip_clean = false
dual_translate_first = false
disable_rich_text_translate = false
enhance_compatibility = false
# For math-heavy dual output, alternating pages preserve page-scale readability better than same-page side-by-side.
use_alternating_pages_dual = true
# Prefer clean final artifacts by default; switch back in the GUI if you need visible provenance.
watermark_output_mode = "no_watermark"
translate_table_text = true
skip_scanned_detection = false
ocr_workaround = false
# auto_enable_ocr_workaround: if ocr contained try-first this
auto_enable_ocr_workaround = false
only_include_translated_page = false
no_merge_alternating_line_numbers = false
no_remove_non_formula_lines = true
non_formula_line_iou_threshold = 0.9
figure_table_protection_threshold = 0.9
skip_formula_offset_calculation = false

# Compatibility rescue example:
# skip_clean = true
# dual_translate_first = true
# disable_rich_text_translate = true
# enhance_compatibility = true
# translate_table_text = false
#
# Long-document stability default:
max_pages_per_part = 50
#
# Scan-like PDF rescue example:
# auto_enable_ocr_workaround = true
# translate_table_text = false

[openai_detail]
# The API key is intentionally NOT stored in this tracked file.
# Provide the real value through `.env` as:
#   PDF2ZH_OPENAI_API_KEY=...
#
# These values can also be overridden through `.env`:
#   PDF2ZH_OPENAI_BASE_URL
#   PDF2ZH_OPENAI_MODEL
#   PDF2ZH_OPENAI_TIMEOUT
#   PDF2ZH_OPENAI_TEMPERATURE
#   PDF2ZH_OPENAI_ENABLE_JSON_MODE
#   PDF2ZH_OPENAI_SEND_TEMPRATURE
#
# Keep the base URL ending with /v1.
# Replace the model after the first-page sanity check if you trust a stronger model more.
openai_model = "gpt-4.1-nano"
openai_base_url = "https://api.openai.com/v1"
openai_timeout = "500"
openai_temperature = "0.0"
openai_enable_json_mode = true
openai_send_temprature = true
# Optional only after baseline validation and only if your chosen model supports it:
# openai_reasoning_effort = "medium"
# openai_send_reasoning_effort = true

[term_openai_detail]
# Dedicated term-extraction engine.
# Keep secrets out of Git and provide them via `.env`, e.g.:
#   PDF2ZH_TERM_OPENAI_API_KEY=...
term_openai_model = "gpt-4.1-nano"
term_openai_base_url = "https://api.openai.com/v1"
term_openai_timeout = "600"
term_openai_temperature = "0.0"
term_openai_enable_json_mode = false
term_openai_send_temprature = true
