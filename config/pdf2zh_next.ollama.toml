# Secondary GUI-only configuration for later comparison with a local Ollama model.
# Do not start from this path for quality-critical mathematical papers.
# First stabilize the OpenAI configuration, then compare this configuration on the same first page.

report_interval = 0.1
ollama = true
term_openai = true

[basic]
gui = true
debug = false
warmup = false
version = false

[gui_settings]
enabled_services = "Ollama"
disable_gui_sensitive_input = false
disable_config_auto_save = true
server_port = 7860
ui_lang = "ja"

[translation]
lang_in = "en"
lang_out = "ja"
output = "/app/pdf2zh_files"
ignore_cache = false
min_text_length = 5
custom_system_prompt = '''You are translating advanced mathematical research papers from English into Japanese for professional mathematicians.

Your highest priority is to preserve exact mathematical meaning, logical structure, and local discourse flow. Produce publication-grade Japanese that reads as a coherent mathematical argument, not as a word-for-word paraphrase.

Translate only natural-language prose into Japanese. Preserve exactly, without translation, rewriting, normalization, or explanation:
- formulas, displayed equations, inline math, LaTeX commands, operators, variables, symbols, placeholders, XML/HTML-like tags, citation markers, reference labels, numbering, code identifiers, URLs, and file paths
- English or symbolic tokens when they function as names, labels, notation, identifiers, diagram labels, arrow labels, object names, functor names, morphism names, section labels, or other formal mathematical designators
- any token whose mathematical role would be damaged by translation

Translate established technical terminology in prose into standard Japanese mathematical language when the term is clearly being used as prose. But if there is any real ambiguity between prose and notation, or between ordinary language and a formal label, preserve the original token exactly rather than guessing. When the source introduces a formal English label or named object, preserve that label exactly and translate only the surrounding prose.

Maintain the exact force of definitions, assumptions, lemmas, propositions, theorems, proofs, remarks, examples, corollaries, captions, and references. Preserve quantifiers, negation, hypotheses, conclusions, dependencies, scope, and contrasts such as if, only if, if and only if, whenever, provided that, conversely, and in particular.

When multiple sentences or clauses are present, translate them as one connected passage. Preserve cross-sentence cohesion, antecedents, and rhetorical flow. Recover natural Japanese sentence flow across artificial PDF line breaks when the meaning is clear, but do not add content, omit content, merge distinct claims, or weaken distinctions.

Write in formal, precise, publication-quality Japanese for research mathematicians. Prefer smooth and expressive academic Japanese over rigid literal calques, but never sacrifice exactness. Keep terminology consistent within the passage.

Output only the translation. Do not add notes, comments, bullets, apologies, summaries, or explanations. If any token is uncertain, preserve it exactly rather than hallucinating or over-translating it.'''
save_auto_extracted_glossary = true
no_auto_extract_glossary = false
# qps = 10
# pool_max_workers = 10
# # Keep term extraction moderately parallel when it is offloaded to OpenAI.
# term_qps = 4
# term_pool_max_workers = 4
# Higher-throughput example after quality is already validated:
qps = 10
pool_max_workers = 10
# Keep term extraction moderately parallel when it is offloaded to OpenAI.
term_qps = 10
term_pool_max_workers = 10
# Optional typography override only if Japanese body text looks visually inconsistent:
# primary_font_family = "serif"

[pdf]
no_dual = false
no_mono = false
formular_font_pattern = '(CM[^R]|MS.M|XY|MT|BL|RM|EU|LA|RS|LINE|LCIRCLE|TeX-|rsfs|txsy|wasy|stmary|.*Mono|.*Code|.*Ital|.*Sym|.*Math)'
formular_char_pattern = '(\(|\||\)|\+|=|\d|[\u0080-\ufaff])'
split_short_lines = false
short_line_split_factor = 0.8
skip_clean = false
dual_translate_first = false
disable_rich_text_translate = false
enhance_compatibility = false
# Match the OpenAI benchmark layout style when comparing outputs.
use_alternating_pages_dual = true
# Prefer clean final artifacts by default; switch back in the GUI if you need visible provenance.
watermark_output_mode = "no_watermark"
translate_table_text = true
skip_scanned_detection = false
ocr_workaround = false
auto_enable_ocr_workaround = false
only_include_translated_page = false
no_merge_alternating_line_numbers = false
no_remove_non_formula_lines = true
non_formula_line_iou_threshold = 0.9
figure_table_protection_threshold = 0.9
skip_formula_offset_calculation = false
max_pages_per_part = 50

[ollama_detail]
# Replace host and model before use.
# For Docker Desktop on the same machine, host.docker.internal is the normal starting point.
# For Linux, add host-gateway mapping or use an Ollama service name on the same Docker network.
ollama_model = "gemma2"
ollama_host = "http://host.docker.internal:11434"
num_predict = 2000

[term_openai_detail]
# Keep the main body translation on Ollama, but offload automatic term extraction to OpenAI.
# Provide the secret via `.env`, e.g.:
#   PDF2ZH_TERM_OPENAI_API_KEY=...
term_openai_model = "gpt-4.1-nano"
term_openai_base_url = "https://api.openai.com/v1"
term_openai_timeout = "600"
term_openai_temperature = "0.0"
term_openai_enable_json_mode = false
term_openai_send_temprature = true
