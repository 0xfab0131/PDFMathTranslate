# Secondary GUI-only configuration for later comparison with a local Ollama model.
# Do not start from this path for quality-critical mathematical papers.
# First stabilize the OpenAI configuration, then compare this configuration on the same first page.

report_interval = 0.5
ollama = true
term_openai = true

[basic]
gui = true
debug = false
warmup = false
version = false

[gui_settings]
enabled_services = "Ollama"
disable_gui_sensitive_input = false
disable_config_auto_save = true
server_port = 7860
ui_lang = "ja"

[translation]
lang_in = "en"
lang_out = "ja"
output = "/app/pdf2zh_files"
ignore_cache = false
min_text_length = 5
custom_system_prompt = '''You are translating advanced mathematical and theoretically dense scholarly papers from English into Japanese for expert readers.

Do not translate by keyword matching or by checking whether a token resembles earlier examples. Translate by structural role and invariant meaning.

For each passage, internally separate four interacting layers:
1) formal surface: formulas, symbols, notation, labels, identifiers, exact names, references, placeholders, and any span whose surface form must remain reusable
2) inferential structure: assumptions, claims, conditions, quantifiers, negation, dependencies, case splits, conclusions, and the direction or scope of assertions
3) discursive prose: explanatory natural language that connects the formal content
4) layout structure: row, item, cell, appendix, case, and boundary relations that organize local meaning

Translate only discursive prose into Japanese. Preserve the formal surface exactly. Preserve inferential structure exactly in meaning and force. Preserve layout structure whenever changing it would alter correspondence, segmentation, or readability.

Your highest priority is semantic invariance: do not change mathematical content, logical scope, structural roles, discourse relations, or local correspondence.

Use the following decision rule for every token or span before translating it:
- If changing the span would alter what can be referred to, matched, indexed, bound, substituted, aligned, cross-referenced, or mechanically reused, preserve it exactly.
- If the span functions as part of a formal rule, derivation schema, pseudo-code schema, symbolic connective system, case marker, appendix schema, table/list label, or any other structural scaffold, preserve it unless it is unmistakably ordinary explanatory prose.
- Never infer that a token is prose merely because it is short, common, English, or visually similar to ordinary language.
- If there is genuine ambiguity between prose and a formal or structural role, choose the narrower intervention: preserve the ambiguous span exactly and translate only the clearly explanatory surroundings.

Translate technical terminology in prose into standard Japanese appropriate to the local field and context. Do not impose vocabulary from one specialty onto another. When multiple conventions are possible, infer from the local mathematical or scholarly context rather than from isolated word meaning.

Maintain the exact force of definitions, assumptions, lemmas, propositions, theorems, proofs, remarks, examples, corollaries, captions, references, algorithmic steps, and stated conditions. Preserve distinctions such as identity vs equality, equality vs isomorphism vs equivalence, source vs target, domain vs codomain, left vs right, covariant vs contravariant, local vs global, necessary vs sufficient, existence vs uniqueness, and assumption vs conclusion. Never reverse direction, weaken a hypothesis, erase a condition, or collapse structurally distinct notions.

In structured regions, preserve row boundaries, item boundaries, cell boundaries, label correspondence, and local parallelism. Do not fuse adjacent cells or list items into one flowing paragraph. Do not expand short structural text into explanatory prose. Keep translations compact where compactness is part of the structure.

Across ordinary prose, preserve antecedents, rhetorical continuity, and the progression of the argument. Recover natural Japanese flow across artificial PDF line breaks when the meaning is clear, but do not add content, omit content, merge distinct claims, invent hidden premises, or translate formal surface into explanatory prose.

Write in formal, precise, publication-quality Japanese suitable for expert readers. Prefer smooth and expressive academic Japanese over rigid literal calques, but never sacrifice invariants for fluency. When multiple renderings are possible, prefer the one that preserves the widest range of structural distinctions with the least interpretive overcommitment.

Output only the translation. Do not add notes, comments, bullets, summaries, apologies, or explanations. If any token remains uncertain, preserve it exactly rather than hallucinating or over-translating it.'''
save_auto_extracted_glossary = true
no_auto_extract_glossary = false
# qps = 10
# pool_max_workers = 10
# # Keep term extraction moderately parallel when it is offloaded to OpenAI.
# term_qps = 4
# term_pool_max_workers = 4
# Higher-throughput example after quality is already validated:
qps = 10
pool_max_workers = 10
# Keep term extraction moderately parallel when it is offloaded to OpenAI.
term_qps = 10
term_pool_max_workers = 10
# Optional typography override only if Japanese body text looks visually inconsistent:
# primary_font_family = "serif"

[pdf]
no_dual = false
no_mono = false
formular_font_pattern = '(CM[^R]|MS.M|XY|MT|BL|RM|EU|LA|RS|LINE|LCIRCLE|TeX-|rsfs|txsy|wasy|stmary|.*Mono|.*Code|.*Ital|.*Sym|.*Math)'
formular_char_pattern = '(\(|\||\)|\+|=|\d|[\u0080-\ufaff])'
split_short_lines = true
short_line_split_factor = 0.8
skip_clean = false
dual_translate_first = false
disable_rich_text_translate = false
enhance_compatibility = false
# Match the OpenAI benchmark layout style when comparing outputs.
use_alternating_pages_dual = true
# Prefer clean final artifacts by default; switch back in the GUI if you need visible provenance.
watermark_output_mode = "no_watermark"
# Table translation is still experimental and tends to destabilize structured layouts.
# Prefer preserving table geometry by default; re-enable only when table text translation
# is more important than layout stability for the current document.
translate_table_text = true
skip_scanned_detection = false
ocr_workaround = false
auto_enable_ocr_workaround = false
only_include_translated_page = false
no_merge_alternating_line_numbers = false
no_remove_non_formula_lines = true
non_formula_line_iou_threshold = 0.9
figure_table_protection_threshold = 0.95
skip_formula_offset_calculation = false
max_pages_per_part = 50

[ollama_detail]
# Replace host and model before use.
# For Docker Desktop on the same machine, host.docker.internal is the normal starting point.
# For Linux, add host-gateway mapping or use an Ollama service name on the same Docker network.
ollama_model = "gemma2"
ollama_host = "http://host.docker.internal:11434"
num_predict = 2000

[term_openai_detail]
# Keep the main body translation on Ollama, but offload automatic term extraction to OpenAI.
# Provide the secret via `.env`, e.g.:
#   PDF2ZH_TERM_OPENAI_API_KEY=...
term_openai_model = "gpt-4.1-nano"
term_openai_base_url = "https://api.openai.com/v1"
term_openai_timeout = "600"
term_openai_temperature = "0.0"
term_openai_enable_json_mode = false
term_openai_send_temprature = true
