# Primary GUI-only deployment for high-fidelity mathematical-paper translation.
# This compose file intentionally switches to pdf2zh_next (the BabelDOC-based 2.x GUI),
# not the legacy stable 1.x GUI, because the 2.x GUI exposes the advanced controls
# that matter for glossary extraction, formula handling, compatibility tuning, and
# other high-precision document-processing options.
#
# IMPORTANT:
# For this use case, a local source build is not required.
# The docs already provide official Docker images for pdf2zh_next.
# This compose file therefore uses the official latest image path by default.

services:
  pdf2zh_next_gui:
    image: ${PDF2ZH_NEXT_IMAGE:-awwaawwa/pdfmathtranslate-next:latest}
    container_name: pdf2zh-next-openai-gui
    ports:
      - "7860:7860"
    env_file:
      - ./.env
    environment:
      HOME: /state/home
      PYTHONUNBUFFERED: "1"
      # Uncomment only if your environment has trouble downloading required assets:
      # HF_ENDPOINT: "https://hf-mirror.com"
    volumes:
      - ./config:/config:ro
      - ./state/pdf2zh_next/home:/state/home
      - ./work/pdf2zh_next/pdf2zh_files:/app/pdf2zh_files
    command:
      - pdf2zh
      - --gui
      - --config-file
      - ${PDF2ZH_NEXT_CONFIG_FILE:-/config/pdf2zh_next.openai.toml}
    stdin_open: true
    tty: true
    restart: unless-stopped

    # To switch image source or config profile, prefer changing `.env` instead of adding more compose files.
    # Example:
    #   PDF2ZH_NEXT_IMAGE=ghcr.io/PDFMathTranslate/PDFMathTranslate-next:latest
    #   PDF2ZH_NEXT_CONFIG_FILE=/config/pdf2zh_next.ollama.toml
    #
    # If needed on Linux, add:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"