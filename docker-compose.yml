# Primary GUI-only deployment for high-fidelity mathematical-paper translation.
# This compose file intentionally switches to pdf2zh_next (the BabelDOC-based 2.x GUI),
# not the legacy stable 1.x GUI, because the 2.x GUI exposes the advanced controls
# that matter for glossary extraction, formula handling, compatibility tuning, and
# other high-precision document-processing options.
#
# IMPORTANT:
# We extend the official pdf2zh_next image with a tiny local build step that
# prewarms BabelDOC assets into the image layer. This avoids repeated asset
# downloads on every GUI startup while keeping runtime translation data volatile.

services:
  pdf2zh_next_gui:
    image: ${PDF2ZH_NEXT_IMAGE:-pdfmathtranslate-next-prewarmed:local}
    build:
      context: .
      dockerfile: docker/pdf2zh-next-prewarmed.Dockerfile
      args:
        PDF2ZH_NEXT_BASE_IMAGE: ${PDF2ZH_NEXT_BASE_IMAGE:-awwaawwa/pdfmathtranslate-next:latest}
    container_name: pdf2zh-next-openai-gui
    ports:
      - "7860:7860"
    env_file:
      - ./.env
    environment:
      HOME: /state/home
      PYTHONUNBUFFERED: "1"
      # Uncomment only if your environment has trouble downloading required assets:
      # HF_ENDPOINT: "https://hf-mirror.com"
    volumes:
      - ./config:/config:ro
    # Keep runtime state and generated outputs off the host filesystem.
    # Only the static BabelDOC assets are baked into the image and reused.
    tmpfs:
      - /state/home:rw,exec,nosuid,size=2g
      - /app/pdf2zh_files:rw,exec,nosuid,size=8g
    command:
      - pdf2zh
      - --gui
      - --config-file
      - ${PDF2ZH_NEXT_CONFIG_FILE:-/config/pdf2zh_next.openai.toml}
    stdin_open: true
    tty: true
    restart: unless-stopped

    # To switch base image source or config profile, prefer changing `.env`
    # instead of adding more compose files.
    # Example:
    #   PDF2ZH_NEXT_BASE_IMAGE=ghcr.io/PDFMathTranslate/PDFMathTranslate-next:latest
    #   PDF2ZH_NEXT_CONFIG_FILE=/config/pdf2zh_next.ollama.toml
    #
    # If needed on Linux, add:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"